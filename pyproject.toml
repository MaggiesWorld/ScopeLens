[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scopelens"
version = "0.1.0"
description = "A reusable inspection and context-discovery engine for files, folders, applications, and related targets."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Margaret D. Thomas" }
]
dependencies = [
    "websocket-client>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]